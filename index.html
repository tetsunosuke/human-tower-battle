<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人間タワーバトル</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <button id="resetButton">🔄 もう いちど やろう！</button>
        </div>
        
        <div id="characterSelect">
            <h4>📸 じぶんを とろう！</h4>
            <div class="character-button camera-button" data-character="camera" id="charCamera" style="display: none;">📷</div>
        </div>
        
        <div id="cameraContainer">
            <video id="cameraVideo" autoplay muted></video>
            <canvas id="cameraCanvas"></canvas>
            <div id="detectedObjects">
                <div>👤 きみを みつけたよ！</div>
            </div>
        </div>
        
        <!-- Help Dialog -->
        <div id="helpDialog" style="display: none;">
            <div class="dialog-overlay">
                <div class="dialog-content">
                    <h2>🏗️ にんげんタワーゲーム 🏗️</h2>
                    <div class="game-description">
                        <p>📸 <strong>カメラで じぶんを うつそう！</strong></p>
                        <p>きみの すがたを カメラで とって、たかい タワーを つくろう！</p>
                        
                        <div class="instructions">
                            <h3>🎮 あそびかた</h3>
                            <ul>
                                <li>📷 カメラに うつってポーズをきめて、ダブルクリックで けってい！</li>
                                <li>⬅️➡️ ひだり・みぎの やじるしキーで ばしょを きめよう</li>
                                <li>⬆️⬇️ うえ・したの やじるしキーで まわそう</li>
                                <li>⏎ エンターキーを おして おとそう</li>
                            </ul>
                        </div>
                        
                        <div class="goal">
                            <h3>🎯 もくひょう</h3>
                            <p>たくさん つんで、たかい タワーを つくろう！<br>
                            どれだけ たかく できるかな？</p>
                        </div>
                    </div>
                    <div class="dialog-controls">
                        <label>
                            <input type="checkbox" id="dontShowAgain"> つぎからは みない
                        </label>
                        <button id="startGameButton">🚀 ゲームを はじめよう！</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
