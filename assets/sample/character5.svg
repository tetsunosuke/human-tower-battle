  <circle cx="30" cy="15" r="8" fill="#DDA0DD" stroke="#333" stroke-width="2"/>
  <rect x="25" y="22" width="10" height="12" fill="#9370DB" stroke="#333" stroke-width="2"/>
  <!-- Crossed arms -->
  <rect x="18" y="25" width="8" height="2" fill="#9370DB" stroke="#333" stroke-width="1" transform="rotate(15 22 26)"/>
  <rect x="34" y="25" width="8" height="2" fill="#9370DB" stroke="#333" stroke-width="1" transform="rotate(-15 38 26)"/>
  <!-- Crossed legs -->
  <ellipse cx="22" cy="38" rx="8" ry="4" fill="#4B0082" stroke="#333" stroke-width="1"/>
  <ellipse cx="38" cy="38" rx="8" ry="4" fill="#4B0082" stroke="#333" stroke-width="1"/>
  <!-- Peaceful eyes -->
  <path d="M 25 13 Q 27 11 29 13" stroke="#000" stroke-width="1.5" fill="none"/>
  <path d="M 31 13 Q 33 11 35 13" stroke="#000" stroke-width="1.5" fill="none"/>
  <!-- Peaceful mouth -->
  <path d="M 27 17 Q 30 19 33 17" stroke="#000" stroke-width="1" fill="none"/>
