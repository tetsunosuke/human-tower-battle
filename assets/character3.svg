<svg width="60" height="60" xmlns="http://www.w3.org/2000/svg">
  <!-- Star Jump - Arms and legs spread wide -->
  <circle cx="30" cy="15" r="8" fill="#98FB98" stroke="#333" stroke-width="2"/>
  <rect x="25" y="22" width="10" height="16" fill="#32CD32" stroke="#333" stroke-width="2"/>
  
  <!-- Star arms - maximum spread -->
  <rect x="5" y="24" width="18" height="3" fill="#32CD32" stroke="#333" stroke-width="1" transform="rotate(-30 14 25.5)"/>
  <rect x="37" y="24" width="18" height="3" fill="#32CD32" stroke="#333" stroke-width="1" transform="rotate(30 46 25.5)"/>
  
  <!-- Wide spread legs -->
  <rect x="15" y="38" width="4" height="16" fill="#556B2F" stroke="#333" stroke-width="1" transform="rotate(-40 17 46)"/>
  <rect x="41" y="38" width="4" height="16" fill="#556B2F" stroke="#333" stroke-width="1" transform="rotate(40 43 46)"/>
  
  <!-- Excited eyes -->
  <circle cx="27" cy="13" r="1.5" fill="#000"/>
  <circle cx="33" cy="13" r="1.5" fill="#000"/>
  
  <!-- Big smile -->
  <path d="M 25 17 Q 30 21 35 17" stroke="#000" stroke-width="2" fill="none"/>
</svg>