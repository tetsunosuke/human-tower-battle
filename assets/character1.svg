<svg width="60" height="60" xmlns="http://www.w3.org/2000/svg">
  <!-- Acrobat - Y-pose with arms spread wide -->
  <circle cx="30" cy="18" r="8" fill="#FFD700" stroke="#333" stroke-width="2"/>
  <rect x="25" y="25" width="10" height="18" fill="#FF1493" stroke="#333" stroke-width="2"/>
  
  <!-- Wide spread arms -->
  <rect x="8" y="27" width="15" height="3" fill="#FF1493" stroke="#333" stroke-width="1" transform="rotate(-25 15.5 28.5)"/>
  <rect x="37" y="27" width="15" height="3" fill="#FF1493" stroke="#333" stroke-width="1" transform="rotate(25 44.5 28.5)"/>
  
  <!-- Strong stance legs -->
  <rect x="22" y="43" width="4" height="14" fill="#8B0000" stroke="#333" stroke-width="1" transform="rotate(-15 24 50)"/>
  <rect x="34" y="43" width="4" height="14" fill="#8B0000" stroke="#333" stroke-width="1" transform="rotate(15 36 50)"/>
  
  <!-- Confident eyes -->
  <circle cx="27" cy="16" r="1.5" fill="#000"/>
  <circle cx="33" cy="16" r="1.5" fill="#000"/>
  
  <!-- Determined mouth -->
  <ellipse cx="30" cy="20" rx="3" ry="1.5" fill="#000"/>
</svg>