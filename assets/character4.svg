<svg width="60" height="60" xmlns="http://www.w3.org/2000/svg">
  <!-- Jumping Person -->
  <circle cx="30" cy="12" r="8" fill="#FFE4B5" stroke="#333" stroke-width="2"/>
  <rect x="25" y="19" width="10" height="14" fill="#FF4500" stroke="#333" stroke-width="2"/>
  <!-- Jumping arms spread -->
  <rect x="12" y="22" width="10" height="2" fill="#FF4500" stroke="#333" stroke-width="1" transform="rotate(-30 17 23)"/>
  <rect x="38" y="22" width="10" height="2" fill="#FF4500" stroke="#333" stroke-width="1" transform="rotate(30 43 23)"/>
  <!-- Jumping legs spread -->
  <rect x="20" y="33" width="3" height="12" fill="#CD853F" stroke="#333" stroke-width="1" transform="rotate(-25 21.5 39)"/>
  <rect x="37" y="33" width="3" height="12" fill="#CD853F" stroke="#333" stroke-width="1" transform="rotate(25 38.5 39)"/>
  <!-- Eyes -->
  <circle cx="27" cy="10" r="1.5" fill="#000"/>
  <circle cx="33" cy="10" r="1.5" fill="#000"/>
  <!-- Excited mouth -->
  <ellipse cx="30" cy="14" rx="3" ry="2" fill="#000"/>
</svg>