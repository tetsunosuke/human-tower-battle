<svg width="60" height="60" xmlns="http://www.w3.org/2000/svg">
  <!-- Sprinter - Dynamic running with high knee lift -->
  <circle cx="30" cy="16" r="8" fill="#FFB6C1" stroke="#333" stroke-width="2"/>
  <rect x="25" y="23" width="10" height="16" fill="#FF6347" stroke="#333" stroke-width="2" transform="rotate(5 30 31)"/>
  
  <!-- Dynamic running arms -->
  <rect x="10" y="25" width="12" height="3" fill="#FF6347" stroke="#333" stroke-width="1" transform="rotate(-35 16 26.5)"/>
  <rect x="38" y="30" width="12" height="3" fill="#FF6347" stroke="#333" stroke-width="1" transform="rotate(40 44 31.5)"/>
  
  <!-- High knee lift and extended leg -->
  <rect x="18" y="35" width="4" height="12" fill="#2F4F4F" stroke="#333" stroke-width="1" transform="rotate(-45 20 41)"/>
  <rect x="32" y="39" width="4" height="18" fill="#2F4F4F" stroke="#333" stroke-width="1" transform="rotate(10 34 48)"/>
  
  <!-- Focused eyes -->
  <circle cx="27" cy="14" r="1.5" fill="#000"/>
  <circle cx="33" cy="14" r="1.5" fill="#000"/>
  
  <!-- Intense mouth -->
  <ellipse cx="30" cy="18" rx="2" ry="1" fill="#000"/>
</svg>